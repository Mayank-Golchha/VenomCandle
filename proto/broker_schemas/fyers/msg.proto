syntax = "proto3";

message Value {
  int64 value = 1;
}

message DepthLevel {
  Value price = 1;
  Value qty = 2;
  Value nord = 3;
  Value num = 4;
}

message Depth {
  Value tbq = 1;
  Value tsq = 2;
  repeated DepthLevel asks = 3;
  repeated DepthLevel bids = 4;
}

message Quote {
  Value ltp = 1;
  Value ltt = 2;
  Value ltq = 3;
  Value vtt = 4;
  Value vtt_diff = 5;
  Value oi = 6;
  Value ltpc = 7;
}

message ExtendedQuote {
  Value atp = 1;
  Value cp = 2;
  Value lc = 3;
  Value uc = 4;
  Value yh = 5;
  Value yl = 6;
  Value poi = 7;
  Value oich = 8;
  Value pc = 9;
}

message DailyQuote {
  Value day_open = 1;
  Value day_high = 2;
  Value day_low = 3;
  Value day_close = 4;
  Value dhoi = 5;
  Value dloi = 6;
}

message Ohlcv {
  Value open = 1;
  Value high = 2;
  Value low = 3;
  Value close = 4;
  Value volume = 5;
  Value epoch = 6;
}

message SymDetail {
  string ticksize = 1;
}

message MarketFeed {
  Quote quote = 1;
  ExtendedQuote eq = 2;
  DailyQuote dq = 3;
  Ohlcv ohlcv = 4;
  Depth depth = 5;
  Value feed_time = 6;
  Value send_time = 7;
  string token = 8;
  uint64 sequence_no = 9;
  bool snapshot = 10;
  string ticker = 11;
  SymDetail symdetail = 12;
}

enum MessageType {
  PING = 0;
  QUOTE = 1;
  EXTENDED_QUOTE = 2;
  DAILY_QUOTE = 3;
  MARKET_LEVEL = 4;
  OHLCV = 5;
  DEPTH = 6;
  ALL = 7;
  RESPONSE = 8;
}

message SocketMessage {
  MessageType message_type = 1;
  map<string, MarketFeed> feeds = 2;
  bool snapshot = 3;
  string msg = 4;
  bool error = 5;
}
